<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好好報價</title>
  <link rel="icon" type="image/png" href="https://imgur.com/925OqUB.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0;
      padding: 10px;
      background-color: #f5f5f5;
      font-size: 16px;
      position: relative;
    }
    .container {
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      padding: 15px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      color: #4A3C31;
      font-size: 1.5em;
      margin: 10px 0;
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
      font-size: 0.9em;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.9em;
      box-sizing: border-box;
    }
    input[type="date"] {
      width: 100%;
      max-width: 200px;
    }
    .discount-container, .adjustment-container {
      margin-bottom: 8px;
    }
    .integer-discount-container, .integer-adjustment-container {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }
    .integer-discount-container select, .integer-adjustment-container select {
      width: 33%;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4A3C31;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 10px;
      touch-action: manipulation;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #5A4C41;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .toggle-button {
      width: auto;
      min-width: 44px;
      min-height: 44px;
      padding: 8px 14px;
      font-size: 0.9em;
      margin-left: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #quoteResult {
      margin-top: 15px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #f9f9f9;
      font-size: 0.9em;
    }
    .quote-summary {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      margin-bottom: 10px;
    }
    .quote-summary dt {
      font-weight: 500;
      color: #4A3C31;
      white-space: nowrap;
    }
    .quote-summary dd {
      margin: 0;
    }
    .quote-total {
      text-align: center;
      padding: 12px;
      margin-top: 10px;
      background: #4A3C31;
      color: white;
      border-radius: 5px;
      font-size: 1.1em;
    }
    .quote-total .amount {
      font-size: 1.4em;
      font-weight: 700;
    }
    .highlight-flash {
      animation: flash 0.6s ease;
    }
    @keyframes flash {
      0%, 100% { background-color: #4A3C31; }
      30% { background-color: #7A6C51; }
    }
    .hidden {
      display: none;
    }
    #dayType {
      margin-top: 5px;
      font-style: italic;
      color: #4A4A4A;
      font-size: 0.85em;
      overflow-wrap: break-word;
    }
    #copyMessage {
      margin-top: 8px;
      font-style: italic;
      text-align: center;
      font-size: 0.85em;
    }
    #nightlyDiscounts, #nightlyTypes {
      margin-top: 8px;
    }
    #quoteTextArea {
      width: 100%;
      height: 80px;
      margin-top: 8px;
      display: none;
      font-size: 0.85em;
    }
    #nightlyBreakdown ul {
      padding-left: 20px;
      margin: 5px 0;
    }
    #nightlyBreakdown li {
      margin-bottom: 5px;
      font-size: 0.85em;
      overflow-wrap: break-word;
    }
    .img-top-right {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 200px;
    }
    .form-error {
      color: #c0392b;
      font-size: 0.82em;
      margin: -4px 0 8px;
      display: none;
    }
    .popular-badge {
      display: inline-block;
      background: #CA8A04;
      color: white;
      font-size: 0.7em;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .price-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85em;
      margin-top: 8px;
    }
    .price-table th, .price-table td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      text-align: center;
    }
    .price-table th {
      background: #4A3C31;
      color: white;
      font-weight: 500;
    }
    .price-table tr:nth-child(even) {
      background: #faf9f7;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    @media (max-width: 600px) {
      body {
        padding: 5px;
        font-size: 14px;
      }
      .container {
        padding: 10px;
      }
      h1 {
        font-size: 1.2em;
      }
      label {
        font-size: 0.85em;
      }
      select, input {
        padding: 8px;
        font-size: 0.85em;
      }
      .integer-discount-container select, .integer-adjustment-container select {
        padding: 8px;
        font-size: 0.85em;
      }
      button {
        padding: 10px;
        font-size: 0.9em;
      }
      #quoteResult {
        padding: 10px;
        font-size: 0.85em;
      }
      #dayType, #copyMessage, #quoteTextArea, #nightlyBreakdown li {
        font-size: 0.8em;
      }
      .img-top-right {
        width: 75px;
        top: 5px;
        right: 5px;
      }
      .quote-summary {
        grid-template-columns: 1fr;
        gap: 2px;
      }
      .quote-summary dt {
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>
  <img src="https://i.imgur.com/925OqUB.jpg" class="img-top-right" alt="民宿標誌">
  <div id="holidayLoadStatus" style="font-size:0.75em;color:#999;text-align:right;padding:2px 8px 0;">假日資料載入中...</div>
  <div class="container">
    <h1>好好報價</h1>
    
    <label for="checkInDate">入住日期</label>
    <input type="date" id="checkInDate" onchange="updateCheckOutDate();" oninput="updateCheckOutDate();">
    <div id="checkInError" class="form-error" role="alert"></div>

    <label for="checkOutDate">退房日期</label>
    <input type="date" id="checkOutDate" onchange="updateDayTypeAndRooms()">
    <div id="checkOutError" class="form-error" role="alert"></div>

    <label for="dayTypeMode">日期類型設定</label>
    <select id="dayTypeMode" onchange="updateDayTypeAndRooms()">
      <option value="auto">自動偵測</option>
      <option value="manual">手動設定</option>
    </select>

    <div id="dayType"></div>
    <div id="nightlyTypes"></div>

    <label for="roomType">選擇房型</label>
    <select id="roomType" onchange="updatePrice()"></select>

    <label for="addBed">加床數（每人每晚 1000元/床，上限4床）</label>
    <select id="addBed" onchange="updatePrice()">
      <option value="0">0 床</option>
      <option value="1">1 床</option>
      <option value="2">2 床</option>
      <option value="3">3 床</option>
      <option value="4">4 床</option>
    </select>

    <div class="adjustment-container">
      <label style="display: inline;">清潔費設定（可選）
        <button class="toggle-button" aria-expanded="false" aria-controls="cleaningFeeSection" onclick="toggleSection('cleaningFeeSection', this)">+</button>
      </label>
      <div id="cleaningFeeSection" class="hidden">
        <select id="cleaningFee" onchange="updatePrice()">
          <option value="0">不收清潔費</option>
          <option value="500">NT$ 500</option>
          <option value="1000">NT$ 1,000</option>
          <option value="1500">NT$ 1,500</option>
          <option value="2000">NT$ 2,000</option>
          <option value="2500">NT$ 2,500</option>
          <option value="3000">NT$ 3,000</option>
        </select>
      </div>
    </div>

    <div class="adjustment-container">
      <label style="display: inline;">暑假調漲模式（7月1日-8月31日）
        <button class="toggle-button" aria-expanded="false" aria-controls="summerPeakAdjustmentSection" onclick="toggleSection('summerPeakAdjustmentSection', this)">+</button>
      </label>
      <div id="summerPeakAdjustmentSection" class="hidden">
        <select id="summerPeakAdjustmentMode" onchange="updateSummerPeakAdjustmentInput()">
          <option value="percentage">比例模式</option>
          <option value="integer">整數模式</option>
        </select>
        <div id="summerPeakAdjustmentInput"></div>
      </div>
    </div>

    <div class="adjustment-container">
      <label style="display: inline;">春節調漲模式（除夕至初三）
        <button class="toggle-button" aria-expanded="false" aria-controls="springFestivalAdjustmentSection" onclick="toggleSection('springFestivalAdjustmentSection', this)">+</button>
      </label>
      <div id="springFestivalAdjustmentSection" class="hidden">
        <select id="springFestivalAdjustmentMode" onchange="updateSpringFestivalAdjustmentInput()">
          <option value="percentage">比例模式</option>
          <option value="integer">整數模式</option>
        </select>
        <div id="springFestivalAdjustmentInput"></div>
      </div>
    </div>

    <div class="discount-container">
      <label style="display: inline;">總價打折數
        <button class="toggle-button" aria-expanded="false" aria-controls="totalDiscountSection" onclick="toggleSection('totalDiscountSection', this)">+</button>
      </label>
      <div id="totalDiscountSection" class="hidden">
        <select id="totalDiscount" onchange="updatePrice()">
          <option value="1.0">無折扣</option>
          <option value="0.95">95折</option>
          <option value="0.9">9折</option>
          <option value="0.85">85折</option>
          <option value="0.8">8折</option>
        </select>
      </div>
    </div>

    <label for="discountMode">折扣模式</label>
    <select id="discountMode" onchange="updateDayTypeAndRooms()">
      <option value="percentage">比例模式</option>
      <option value="integer">整數模式</option>
      <option value="mixed">混合模式</option>
    </select>

    <div id="nightlyDiscounts"></div>

    <button id="generateBtn" onclick="generateQuote()">生成報價單</button>
    <div id="generateError" class="form-error" role="alert"></div>

    <div class="adjustment-container">
      <label style="display: inline;">價格對照表
        <button class="toggle-button" aria-expanded="false" aria-controls="priceTableSection" onclick="toggleSection('priceTableSection', this)">+</button>
      </label>
      <div id="priceTableSection" class="hidden">
        <table class="price-table">
          <thead>
            <tr><th>房型</th><th>平日</th><th>假日</th><th>春節</th></tr>
          </thead>
          <tbody>
            <tr><td>四人微包棟</td><td>11,800</td><td>27,800</td><td>36,800</td></tr>
            <tr><td>六人微包棟</td><td>13,800</td><td>27,800</td><td>36,800</td></tr>
            <tr><td>八人小包棟</td><td>16,800</td><td>27,800</td><td>36,800</td></tr>
            <tr><td>十人中包棟</td><td>18,800</td><td>27,800</td><td>36,800</td></tr>
            <tr><td>十二人大包棟</td><td>21,800</td><td>27,800</td><td>36,800</td></tr>
          </tbody>
        </table>
        <p style="font-size:0.8em;color:#6b6b6b;margin-top:4px;">加床：NT$ 1,000/人/晚（上限4床）</p>
      </div>
    </div>

    <div id="quoteResult" class="hidden">
      <dl class="quote-summary">
        <dt>入住日期</dt><dd><span id="quoteCheckInDate"></span></dd>
        <dt>退房日期</dt><dd><span id="quoteCheckOutDate"></span></dd>
        <dt>日期類型</dt><dd><span id="quoteDayType"></span></dd>
        <dt>房型</dt><dd><span id="quoteRoomType"></span></dd>
        <dt>入住天數</dt><dd><span id="quoteNumNights"></span> 晚</dd>
        <dt id="quoteSummerPeakAdjustmentRow" class="hidden">暑假調漲</dt><dd id="quoteSummerPeakAdjustmentVal" class="hidden"><span id="quoteSummerPeakAdjustment"></span></dd>
        <dt id="quoteSpringFestivalAdjustmentRow" class="hidden">春節調漲</dt><dd id="quoteSpringFestivalAdjustmentVal" class="hidden"><span id="quoteSpringFestivalAdjustment"></span></dd>
      </dl>
      <div id="nightlyBreakdown"></div>
      <dl class="quote-summary">
        <dt id="quoteAddBedRow" class="hidden">加床費用</dt><dd id="quoteAddBedVal" class="hidden">NT$ <span id="quoteAddBed"></span></dd>
        <dt id="quoteCleaningFeeRow" class="hidden">清潔費</dt><dd id="quoteCleaningFeeVal" class="hidden">NT$ <span id="quoteCleaningFee"></span></dd>
        <dt id="quoteTotalDiscountRow" class="hidden">總價折扣</dt><dd id="quoteTotalDiscountVal" class="hidden"><span id="quoteTotalDiscount"></span></dd>
      </dl>
      <div class="quote-total" id="quoteTotalBox">
        總金額 NT$ <span class="amount" id="quoteTotal"></span><br>
        <span style="font-size:0.75em;">訂金(50%) NT$ <span id="quoteDeposit"></span></span>
      </div>
      <button onclick="copyQuote()">複製報價單內容</button>
      <div id="copyMessage" class="hidden" aria-live="polite"></div>
      <textarea id="quoteTextArea" readonly></textarea>
    </div>
  </div>

  <script>
    /* 平日價格 */
    const basePrices = {
      "四人微包棟": { weekday: 11800, people: 4 },
      "六人微包棟": { weekday: 13800, people: 6 },
      "八人小包棟": { weekday: 16800, people: 8 },
      "十人中包棟": { weekday: 18800, people: 10 },
      "十二人大包棟": { weekday: 21800, people: 12 }
    };

    /* 房型顯示名稱 */
    const roomTypeDisplay = {
      "四人微包棟": "四人微包棟(雙人房*2 或 四人房*1)",
      "六人微包棟": "六人微包棟(雙人房*1、四人房*1)",
      "八人小包棟": "八人小包棟(雙人房*2、四人房*1 或 四人房*2)",
      "十人中包棟": "十人中包棟(雙人房*1、四人房*2)",
      "十二人大包棟": "十二人大包棟(雙人房*2、四人房*2)"
    };

    /* 春節期間（fallback，API 載入後會覆寫） */
    let springFestivalPeriods = [
      { start: new Date("2025-01-25"), end: new Date("2025-02-02") },
      { start: new Date("2026-02-14"), end: new Date("2026-02-22") },
      { start: new Date("2027-02-04"), end: new Date("2027-02-10") },
      { start: new Date("2028-01-22"), end: new Date("2028-02-01") },
      { start: new Date("2029-02-09"), end: new Date("2029-02-18") },
      { start: new Date("2030-01-30"), end: new Date("2030-02-08") }
    ];

    /* 除夕至初三（fallback，API 載入後會覆寫） */
    let springFestivalEveToThirdDay = [
      { start: new Date("2025-01-28"), end: new Date("2025-01-31") },
      { start: new Date("2026-02-16"), end: new Date("2026-02-19") },
      { start: new Date("2027-02-05"), end: new Date("2027-02-08") },
      { start: new Date("2028-01-25"), end: new Date("2028-01-28") },
      { start: new Date("2029-02-12"), end: new Date("2029-02-15") },
      { start: new Date("2030-02-02"), end: new Date("2030-02-05") }
    ];

    /* 國定假日（fallback，API 載入後會覆寫） */
    let nationalHolidays = [
      new Date("2025-01-01"),
      new Date("2025-02-28"), new Date("2025-03-01"), new Date("2025-03-02"),
      new Date("2025-04-03"), new Date("2025-04-04"), new Date("2025-04-05"), new Date("2025-04-06"),
      new Date("2025-05-01"),
      new Date("2025-05-30"), new Date("2025-05-31"), new Date("2025-06-01"), 
      new Date("2025-09-28"), 
      new Date("2025-10-04"), new Date("2025-10-05"), 
      new Date("2025-10-10"), new Date("2025-10-11"), 
      new Date("2025-10-24"), new Date("2025-10-25"),
      new Date("2025-12-25"),
      new Date("2026-01-01"), new Date("2026-02-15"),
      new Date("2026-02-27"), new Date("2026-02-28"), new Date("2026-03-01"),
      new Date("2026-04-03"), new Date("2026-04-04"), new Date("2026-04-05"),
      new Date("2026-05-01"),
      new Date("2026-06-19"), new Date("2026-06-20"),
      new Date("2026-09-25"), new Date("2026-09-27"),
      new Date("2026-10-09"), new Date("2026-10-10"), new Date("2026-12-25"),
      new Date("2027-01-01"),
      new Date("2027-02-27"), new Date("2027-02-28"), 
      new Date("2027-04-03"), new Date("2027-04-04"), new Date("2027-04-05"),
      new Date("2027-04-30"), new Date("2027-05-01"),
      new Date("2027-06-09"),
      new Date("2027-09-15"), new Date("2027-09-28"),
      new Date("2027-10-09"), new Date("2027-10-10"), new Date("2027-10-24"),
      new Date("2027-12-24"), new Date("2027-12-31"),
      // 2028
      new Date("2028-01-01"),
      new Date("2028-01-25"), new Date("2028-01-26"), new Date("2028-01-27"), new Date("2028-01-28"), new Date("2028-01-29"), new Date("2028-01-30"),
      new Date("2028-02-28"), new Date("2028-02-29"),
      new Date("2028-04-04"), new Date("2028-04-05"), new Date("2028-04-06"),
      new Date("2028-05-01"),
      new Date("2028-06-14"), new Date("2028-06-15"),
      new Date("2028-09-22"), new Date("2028-09-23"),
      new Date("2028-10-10"), new Date("2028-10-11"),
      new Date("2028-12-25"),
    ];

    /* ── 人事行政局假日 API 串接 ─────────────────────────────── */
    const HOLIDAY_CDN = 'https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/';
    const CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 天

    function getCachedHolidays(year) {
      try {
        const raw = localStorage.getItem('tw-holidays-' + year);
        if (!raw) return null;
        const { ts, data } = JSON.parse(raw);
        if (Date.now() - ts > CACHE_TTL_MS) { localStorage.removeItem('tw-holidays-' + year); return null; }
        return data;
      } catch { return null; }
    }

    function setCachedHolidays(year, data) {
      try { localStorage.setItem('tw-holidays-' + year, JSON.stringify({ ts: Date.now(), data })); } catch {}
    }

    async function fetchHolidayYear(year) {
      const cached = getCachedHolidays(year);
      if (cached) return cached;
      try {
        const res = await fetch(HOLIDAY_CDN + year + '.json');
        if (!res.ok) return null;
        const data = await res.json();
        setCachedHolidays(year, data);
        return data;
      } catch { return null; }
    }

    function parseDate8(str) {
      // "20260216" → Date（UTC 午夜）
      return new Date(str.slice(0, 4) + '-' + str.slice(4, 6) + '-' + str.slice(6, 8));
    }

    function parseHolidayData(allYearData) {
      const holidays = [];
      const springDays = [];  // dates with 春節/除夕/小年夜 description
      const eveDates = [];    // dates with exactly 農曆除夕

      allYearData.forEach(item => {
        if (!item.isHoliday) return;
        const d = parseDate8(item.date);
        holidays.push(d);
        const desc = item.description || '';
        if (desc.includes('春節') || desc.includes('除夕') || desc === '小年夜') {
          springDays.push(d);
        }
        if (desc === '農曆除夕') {
          eveDates.push(d);
        }
      });

      // 建立 springFestivalPeriods（每年的春節叢集 ±3天緩衝）
      const periods = [];
      if (springDays.length) {
        const sorted = springDays.slice().sort((a, b) => a - b);
        let clusterStart = sorted[0], clusterEnd = sorted[0];
        for (let i = 1; i < sorted.length; i++) {
          const diff = (sorted[i] - sorted[i - 1]) / 86400000;
          if (diff <= 8) { // 同一叢集（最多間隔8天）
            clusterEnd = sorted[i];
          } else {
            periods.push({
              start: new Date(clusterStart.getTime() - 3 * 86400000),
              end:   new Date(clusterEnd.getTime()   + 3 * 86400000)
            });
            clusterStart = sorted[i];
            clusterEnd   = sorted[i];
          }
        }
        periods.push({
          start: new Date(clusterStart.getTime() - 3 * 86400000),
          end:   new Date(clusterEnd.getTime()   + 3 * 86400000)
        });
      }

      // 建立 springFestivalEveToThirdDay（除夕 ~ 初三 = 除夕+3天）
      const eveToThird = eveDates.map(eve => ({
        start: eve,
        end:   new Date(eve.getTime() + 3 * 86400000)
      }));

      return { holidays, periods, eveToThird };
    }

    async function initHolidayData() {
      const statusEl = document.getElementById('holidayLoadStatus');
      const curYear = new Date().getFullYear();
      const years = [curYear, curYear + 1, curYear + 2, curYear + 3];

      const results = await Promise.allSettled(years.map(y => fetchHolidayYear(y)));

      const allData = [];
      let anySuccess = false;
      results.forEach((r, i) => {
        if (r.status === 'fulfilled' && r.value) {
          allData.push(...r.value);
          anySuccess = true;
        }
      });

      if (anySuccess) {
        const { holidays, periods, eveToThird } = parseHolidayData(allData);

        // 僅覆寫 API 有資料的年份，保留 fallback 中 API 未覆蓋的年份
        const apiYears = new Set(allData.map(item => parseInt(item.date.slice(0, 4))));

        nationalHolidays = [
          ...nationalHolidays.filter(d => !apiYears.has(d.getFullYear())),
          ...holidays
        ];
        if (periods.length) {
          springFestivalPeriods = [
            ...springFestivalPeriods.filter(p => !apiYears.has(p.start.getFullYear())),
            ...periods
          ];
        }
        if (eveToThird.length) {
          springFestivalEveToThirdDay = [
            ...springFestivalEveToThirdDay.filter(p => !apiYears.has(p.start.getFullYear())),
            ...eveToThird
          ];
        }
        if (statusEl) statusEl.textContent = '';
      } else {
        if (statusEl) statusEl.textContent = '使用內建假日資料';
      }

      // 若已填入日期，重新計算
      const checkIn = document.getElementById('checkInDate').value;
      const checkOut = document.getElementById('checkOutDate').value;
      if (checkIn && checkOut) updateDayTypeAndRooms();
    }
    /* ── end API 串接 ──────────────────────────────────────── */

    function isSpringFestival(date) {
      return springFestivalPeriods.some(period => 
        date >= period.start && date <= period.end
      );
    }

    function isSpringFestivalEveToThirdDay(date) {
      return springFestivalEveToThirdDay.some(period => 
        date >= period.start && date <= period.end
      );
    }

    function isNationalHoliday(date) {
      return nationalHolidays.some(holiday => 
        holiday.getFullYear() === date.getFullYear() &&
        holiday.getMonth() === date.getMonth() &&
        holiday.getDate() === date.getDate()
      );
    }

    function isHoliday(date) {
      const day = date.getDay();
      return day === 6 || isSpringFestival(date) || isNationalHoliday(date);
    }

    function isSummerPeakSeason(date) {
      const month = date.getMonth();
      const day = date.getDate();
      return (month === 6 && day >= 1) || (month === 7 && day <= 31);
    }

    function calculateNights() {
      const checkIn = new Date(document.getElementById("checkInDate").value);
      const checkOut = new Date(document.getElementById("checkOutDate").value);
      if (checkIn && checkOut && checkOut > checkIn) {
        const diffTime = Math.abs(checkOut - checkIn);
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      }
      return 0;
    }

    function updateCheckOutDate() {
      const checkInDate = document.getElementById("checkInDate").value;
      const checkOutInput = document.getElementById("checkOutDate");

      if (!checkInDate) {

        return;
      }

      try {
        const checkIn = new Date(checkInDate);
        if (isNaN(checkIn.getTime())) {
          console.error("入住日期無效:", checkInDate);
          return;
        }

        const nextDay = new Date(checkIn);
        nextDay.setDate(checkIn.getDate() + 1);
        const formattedNextDay = nextDay.toISOString().split('T')[0];
        
        checkOutInput.value = formattedNextDay;
        console.log("退房日期已更新為:", formattedNextDay);

        updateDayTypeAndRooms();
      } catch (error) {
        console.error("更新退房日期時發生錯誤:", error);
      }
    }

    function calculatePricePerNight() {
      const checkIn = new Date(document.getElementById("checkInDate").value);
      const checkOut = new Date(document.getElementById("checkOutDate").value);
      const dayTypeMode = document.getElementById("dayTypeMode").value;
      const discountMode = document.getElementById("discountMode").value;
      const roomType = document.getElementById("roomType").value;
      const addBed = parseInt(document.getElementById("addBed").value);
      const summerPeakAdjustmentMode = document.getElementById("summerPeakAdjustmentMode")?.value || "percentage";
      const springFestivalAdjustmentMode = document.getElementById("springFestivalAdjustmentMode")?.value || "percentage";
      const totalDiscount = parseFloat(document.getElementById("totalDiscount")?.value || 1.0);
      const dayNames = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

      let summerPeakAdjustment = 1.0;
      let summerPeakAdjustmentAmount = 0;
      let applySummerPeakAdjustmentAmount = false;
      if (document.getElementById("summerPeakAdjustmentSection")?.classList.contains("hidden")) {
        summerPeakAdjustment = 1.0;
        summerPeakAdjustmentAmount = 0;
      } else if (summerPeakAdjustmentMode === "percentage") {
        summerPeakAdjustment = parseFloat(document.getElementById("summerPeakAdjustment")?.value || 1.0);
      } else {
        const wan = parseInt(document.getElementById("summerPeakAdjustment_wan")?.value || 0);
        const qian = parseInt(document.getElementById("summerPeakAdjustment_qian")?.value || 0);
        const bai = parseInt(document.getElementById("summerPeakAdjustment_bai")?.value || 0);
        summerPeakAdjustmentAmount = wan * 10000 + qian * 1000 + bai * 100;
        applySummerPeakAdjustmentAmount = summerPeakAdjustmentAmount > 0;
      }

      let springFestivalAdjustment = 1.0;
      let springFestivalAdjustmentAmount = 0;
      let applySpringFestivalAdjustmentAmount = false;
      if (document.getElementById("springFestivalAdjustmentSection")?.classList.contains("hidden")) {
        springFestivalAdjustment = 1.0;
        springFestivalAdjustmentAmount = 0;
      } else if (springFestivalAdjustmentMode === "percentage") {
        springFestivalAdjustment = parseFloat(document.getElementById("springFestivalAdjustment")?.value || 1.0);
      } else {
        const wan = parseInt(document.getElementById("springFestivalAdjustment_wan")?.value || 0);
        const qian = parseInt(document.getElementById("springFestivalAdjustment_qian")?.value || 0);
        const bai = parseInt(document.getElementById("springFestivalAdjustment_bai")?.value || 0);
        springFestivalAdjustmentAmount = wan * 10000 + qian * 1000 + bai * 100;
        applySpringFestivalAdjustmentAmount = springFestivalAdjustmentAmount > 0;
      }

      if (!checkIn || !checkOut || checkOut <= checkIn || !roomType) return { total: 0, breakdown: [], addBed: 0 };

      let totalPrice = 0;
      let currentDate = new Date(checkIn);
      let nightCount = 0;
      let breakdown = [];

      while (currentDate < checkOut) {
        nightCount++;
        let price;
        let basePrice;
        let nightType;
        const dateStr = currentDate.toISOString().split('T')[0];
        let nightDiscount = 1.0;
        let integerPrice = 0;
        let useIntegerMode = false;

        const nightModeElement = document.getElementById(`discountModeNight${nightCount}`);
        const nightMode = discountMode === "mixed" && nightModeElement ? nightModeElement.value : discountMode;
        if (nightMode === "percentage") {
          nightDiscount = parseFloat(document.getElementById(`discountNight${nightCount}`)?.value || 1.0);
        } else {
          const wan = parseInt(document.getElementById(`discountNight${nightCount}_wan`)?.value || 0);
          const qian = parseInt(document.getElementById(`discountNight${nightCount}_qian`)?.value || 0);
          const bai = parseInt(document.getElementById(`discountNight${nightCount}_bai`)?.value || 0);
          integerPrice = wan * 10000 + qian * 1000 + bai * 100;
          useIntegerMode = integerPrice > 0;
        }

        if (dayTypeMode === "auto") {
          const isHolidayNight = isHoliday(currentDate);
          nightType = isHolidayNight ? (isNationalHoliday(currentDate) ? "nationalHoliday" : "holiday") : "weekday";
        } else {
          nightType = document.getElementById(`nightType${nightCount}`)?.value || "weekday";
        }

        const isPeakSeason = isSummerPeakSeason(currentDate);
        const isSpringFestivalEveToThird = isSpringFestivalEveToThirdDay(currentDate);

        if (useIntegerMode) {
          price = integerPrice;
        } else {
          if (isSpringFestivalEveToThird || (nightType === "nationalHoliday" && isSpringFestival(currentDate))) {
            basePrice = 36800;
            price = applySpringFestivalAdjustmentAmount ? basePrice + springFestivalAdjustmentAmount : basePrice * springFestivalAdjustment;
          } else if (nightType === "holiday" || nightType === "nationalHoliday") {
            basePrice = 27800;
            if (isPeakSeason) {
              price = applySummerPeakAdjustmentAmount ? basePrice + summerPeakAdjustmentAmount : basePrice * summerPeakAdjustment;
            } else {
              price = basePrice;
            }
          } else {
            basePrice = basePrices[roomType]?.weekday || 0;
            if (isPeakSeason) {
              price = applySummerPeakAdjustmentAmount ? basePrice + summerPeakAdjustmentAmount : basePrice * summerPeakAdjustment;
            } else {
              price = basePrice;
            }
          }
          price = price * nightDiscount;
        }

        totalPrice += price;
        breakdown.push({ 
          date: dateStr, 
          price: price, 
          type: nightType === "weekday" ? `平日(${dayNames[currentDate.getDay()]})` : nightType === "holiday" ? `假日(${dayNames[currentDate.getDay()]})` : `國定假日(${dayNames[currentDate.getDay()]})`, 
          night: nightCount, 
          discount: nightDiscount,
          integerPrice: integerPrice,
          useIntegerMode: useIntegerMode,
          isPeakSeason: isPeakSeason,
          summerPeakAdjustment: summerPeakAdjustment,
          summerPeakAdjustmentAmount: summerPeakAdjustmentAmount,
          applySummerPeakAdjustmentAmount: applySummerPeakAdjustmentAmount,
          isSpringFestivalEveToThird: isSpringFestivalEveToThird,
          springFestivalAdjustment: springFestivalAdjustment,
          springFestivalAdjustmentAmount: springFestivalAdjustmentAmount,
          applySpringFestivalAdjustmentAmount: applySpringFestivalAdjustmentAmount
        });
        currentDate.setDate(currentDate.getDate() + 1);
      }

      const numNights = calculateNights();
      const bedCost = addBed * 1000 * numNights;
      const cleaningFee = parseInt(document.getElementById("cleaningFee")?.value || 0);
      const finalTotal = (totalPrice + bedCost) * totalDiscount + cleaningFee;
      return {
        total: finalTotal,
        breakdown: breakdown,
        addBed: addBed,
        cleaningFee: cleaningFee,
        summerPeakAdjustment: summerPeakAdjustment,
        summerPeakAdjustmentAmount: summerPeakAdjustmentAmount,
        applySummerPeakAdjustmentAmount: applySummerPeakAdjustmentAmount,
        springFestivalAdjustment: springFestivalAdjustment,
        springFestivalAdjustmentAmount: springFestivalAdjustmentAmount,
        applySpringFestivalAdjustmentAmount: applySpringFestivalAdjustmentAmount
      };
    }

    function updatePrice() {
      const result = calculatePricePerNight();
      if (result.total > 0) {
        document.getElementById("quoteTotal").textContent = Math.round(result.total).toLocaleString();
        document.getElementById("quoteDeposit").textContent = Math.round(result.total * 0.5).toLocaleString();
        document.getElementById("quoteResult").classList.remove("hidden");
      } else {
        document.getElementById("quoteResult").classList.add("hidden");
      }
      return result.total;
    }

    function generateQuote() {
      clearErrors();
      var checkInDate = document.getElementById("checkInDate").value;
      var checkOutDate = document.getElementById("checkOutDate").value;
      var roomType = document.getElementById("roomType").value;
      var hasError = false;

      if (!checkInDate) {
        showError('checkInError', '請選擇入住日期'); hasError = true;
      }
      if (!checkOutDate) {
        showError('checkOutError', '請選擇退房日期'); hasError = true;
      } else if (checkInDate && new Date(checkOutDate) <= new Date(checkInDate)) {
        showError('checkOutError', '退房日期必須晚於入住日期'); hasError = true;
      }
      if (!roomType) {
        showError('generateError', '請選擇房型'); hasError = true;
      }
      if (hasError) return;

      var btn = document.getElementById("generateBtn");
      btn.disabled = true; btn.textContent = "生成中...";

      setTimeout(function() {
        var numNights = calculateNights();
        var addBed = parseInt(document.getElementById("addBed").value);
        var totalDiscount = parseFloat(document.getElementById("totalDiscount")?.value || 1.0);
        var result = calculatePricePerNight();
        var total = result.total, breakdown = result.breakdown, cleaningFee = result.cleaningFee;
        var summerPeakAdjustment = result.summerPeakAdjustment, summerPeakAdjustmentAmount = result.summerPeakAdjustmentAmount, applySummerPeakAdjustmentAmount = result.applySummerPeakAdjustmentAmount;
        var springFestivalAdjustment = result.springFestivalAdjustment, springFestivalAdjustmentAmount = result.springFestivalAdjustmentAmount, applySpringFestivalAdjustmentAmount = result.applySpringFestivalAdjustmentAmount;

        var dayTypeText = "";
        breakdown.forEach(function(item) {
          dayTypeText += "\u7B2C" + item.night + "\u665A\uFF1A" + item.type;
          if (item.night < numNights) dayTypeText += "\uFF0C";
        });

        var totalDiscountText = totalDiscount === 1.0 ? "\u7121\u6298\u6263" : totalDiscount === 0.9 ? "9\u6298" : totalDiscount === 0.8 ? "8\u6298" : (totalDiscount * 100) + "\u6298";
        var summerPeakAdjustmentText = applySummerPeakAdjustmentAmount ? "NT$ " + summerPeakAdjustmentAmount.toLocaleString() + " (\u52A0\u50F9\u91D1\u984D)" : summerPeakAdjustment === 1.0 ? "\u7121\u8ABF\u6F32" : "\u8ABF\u6F32" + Math.round((summerPeakAdjustment - 1) * 100) + "%";
        var springFestivalAdjustmentText = applySpringFestivalAdjustmentAmount ? "NT$ " + springFestivalAdjustmentAmount.toLocaleString() + " (\u52A0\u50F9\u91D1\u984D)" : springFestivalAdjustment === 1.0 ? "\u7121\u8ABF\u6F32" : "\u8ABF\u6F32" + Math.round((springFestivalAdjustment - 1) * 100) + "%";

        document.getElementById("quoteCheckInDate").textContent = checkInDate || "\u672A\u9078\u64C7";
        document.getElementById("quoteCheckOutDate").textContent = checkOutDate || "\u672A\u9078\u64C7";
        document.getElementById("quoteDayType").textContent = dayTypeText;
        document.getElementById("quoteRoomType").textContent = roomTypeDisplay[roomType] || roomType;
        document.getElementById("quoteNumNights").textContent = numNights;

        var showSummer = applySummerPeakAdjustmentAmount || summerPeakAdjustment !== 1.0;
        toggleDlRow("quoteSummerPeakAdjustmentRow", "quoteSummerPeakAdjustmentVal", showSummer);
        if (showSummer) document.getElementById("quoteSummerPeakAdjustment").textContent = summerPeakAdjustmentText;

        var showSpring = applySpringFestivalAdjustmentAmount || springFestivalAdjustment !== 1.0;
        toggleDlRow("quoteSpringFestivalAdjustmentRow", "quoteSpringFestivalAdjustmentVal", showSpring);
        if (showSpring) document.getElementById("quoteSpringFestivalAdjustment").textContent = springFestivalAdjustmentText;

        var breakdownHtml = "<p><strong>\u6BCF\u665A\u50F9\u683C\u660E\u7D30\uFF1A</strong></p><ul>";
        breakdown.forEach(function(item) {
          var discountText = "";
          if (item.useIntegerMode) {
            discountText = item.integerPrice > 0 ? "(\u512A\u60E0\u50F9)" : "";
          } else {
            var dd = item.discount;
            var discountDisplay = dd === 1.0 ? "" : dd === 0.9 ? "9\u6298\u50F9" : dd === 0.8 ? "8\u6298\u50F9" : dd === 0.7 ? "7\u6298\u50F9" : dd === 0.65 ? "65\u6298\u50F9" : dd === 0.55 ? "55\u6298\u50F9" : dd === 0.5 ? "5\u6298" : (dd * 100) + "\u6298\u50F9";
            discountText = discountDisplay ? "(" + discountDisplay + ")" : "";
          }
          breakdownHtml += "<li>\u7B2C" + item.night + "\u665A " + item.date + " (" + item.type.match(/^(.*?)\(/)[1] + ")\uFF1ANT$ " + Math.round(item.price).toLocaleString() + " " + discountText + "</li>";
        });
        breakdownHtml += "</ul>";
        document.getElementById("nightlyBreakdown").innerHTML = breakdownHtml;

        toggleDlRow("quoteAddBedRow", "quoteAddBedVal", addBed > 0);
        if (addBed > 0) document.getElementById("quoteAddBed").textContent = (addBed * 1000 * numNights).toLocaleString() + "\uFF08\u52A0\u5E8A\u6578\uFF1A" + addBed + " \u5E8A\uFF09";

        toggleDlRow("quoteCleaningFeeRow", "quoteCleaningFeeVal", cleaningFee > 0);
        if (cleaningFee > 0) document.getElementById("quoteCleaningFee").textContent = cleaningFee.toLocaleString();

        var showDiscount = !document.getElementById("totalDiscountSection").classList.contains("hidden") && totalDiscount !== 1.0;
        toggleDlRow("quoteTotalDiscountRow", "quoteTotalDiscountVal", showDiscount);
        if (showDiscount) document.getElementById("quoteTotalDiscount").textContent = totalDiscountText;

        document.getElementById("quoteTotal").textContent = Math.round(total).toLocaleString();
        document.getElementById("quoteDeposit").textContent = Math.round(total * 0.5).toLocaleString();

        document.getElementById("quoteResult").classList.remove("hidden");
        document.getElementById("copyMessage").classList.add("hidden");
        document.getElementById("quoteTextArea").style.display = "none";

        // Scroll & highlight
        var totalBox = document.getElementById("quoteTotalBox");
        totalBox.classList.remove("highlight-flash");
        void totalBox.offsetWidth;
        totalBox.classList.add("highlight-flash");
        document.getElementById("quoteResult").scrollIntoView({ behavior: "smooth", block: "start" });

        btn.disabled = false; btn.textContent = "\u751F\u6210\u5831\u50F9\u55AE";
      }, 50);
    }

    function copyQuote() {
      const addBed = parseInt(document.getElementById("addBed").value);
      let quoteText = `

入住日期：${document.getElementById("quoteCheckInDate").textContent}
退房日期：${document.getElementById("quoteCheckOutDate").textContent}
日期類型：${document.getElementById("quoteDayType").textContent}
房型：${document.getElementById("quoteRoomType").textContent}
入住天數：${document.getElementById("quoteNumNights").textContent} 晚
      `.trim();

      if (!document.getElementById("quoteSummerPeakAdjustmentRow").classList.contains("hidden")) {
        quoteText += `\n暑假調漲：${document.getElementById("quoteSummerPeakAdjustment").textContent}`;
      }
      if (!document.getElementById("quoteSpringFestivalAdjustmentRow").classList.contains("hidden")) {
        quoteText += `\n春節調漲：${document.getElementById("quoteSpringFestivalAdjustment").textContent}`;
      }

      quoteText += `\n\n每晚價格明細：`;
      quoteText += `\n${Array.from(document.querySelectorAll("#nightlyBreakdown ul li")).map(item => "• " + item.textContent).join("\n")}`;

      if (addBed > 0) {
        quoteText += `\n加床費用：NT$ ${document.getElementById("quoteAddBed").textContent}`;
      }
      if (!document.getElementById("quoteCleaningFeeRow").classList.contains("hidden")) {
        quoteText += `\n清潔費：NT$ ${document.getElementById("quoteCleaningFee").textContent}`;
      }
      if (!document.getElementById("quoteTotalDiscountRow").classList.contains("hidden")) {
        quoteText += `\n總價折扣：${document.getElementById("quoteTotalDiscount").textContent}`;
      }
      quoteText += `\n\n總金額：NT$ ${document.getElementById("quoteTotal").textContent}；訂金(50%)：NT$ ${document.getElementById("quoteDeposit").textContent}`;

      const copyMessage = document.getElementById("copyMessage");
      const textArea = document.getElementById("quoteTextArea");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(quoteText).then(() => {
          copyMessage.textContent = "報價單內容已複製！";
          copyMessage.style.color = "green";
          copyMessage.classList.remove("hidden");
          textArea.style.display = "none";
          setTimeout(() => copyMessage.classList.add("hidden"), 4000);
        }).catch(err => {
          textArea.value = quoteText;
          textArea.style.display = "block";
          copyMessage.textContent = "複製失敗，請從下方選取並手動複製！（建議使用最新版本的 Chrome、Firefox 或 Safari）";
          copyMessage.style.color = "red";
          copyMessage.classList.remove("hidden");
          setTimeout(() => copyMessage.classList.add("hidden"), 4000);
        });
      } else {
        textArea.value = quoteText;
        textArea.style.display = "block";
        copyMessage.textContent = "您的瀏覽器不支援自動複製，請從下方選取並手動複製！（建議使用最新版本的 Chrome、Firefox 或 Safari）";
        copyMessage.style.color = "red";
        copyMessage.classList.remove("hidden");
        setTimeout(() => copyMessage.classList.add("hidden"), 4000);
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const checkInInput = document.getElementById("checkInDate");
      const today = new Date().toISOString().split('T')[0];
      checkInInput.setAttribute("min", today);

      const checkOutInput = document.getElementById("checkOutDate");
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      checkOutInput.setAttribute("min", tomorrow.toISOString().split('T')[0]);

      if (checkInInput.value) {
        updateCheckOutDate();
      }

      // 串接人事行政局假日資料
      initHolidayData();
    });
  </script>
</body>
</html>
